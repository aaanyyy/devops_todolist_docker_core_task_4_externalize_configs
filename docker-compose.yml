# docker-compose.yml
version: '3'
networks:
  todoapp-net:
services:
  pythonapp:
    image: todoapp:2.0.0
    env_file:
      - .env

    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

    environment:
      - PYTHONUNBUFFERED=1
      - ENV MYSQL_ENGINE=mysql.connector.django

    networks:
      - todoapp-net
    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped
  mysql:
    image: mysql-local:3.0.0
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    ports:
      - "3306:3306"
    volumes:
      - todoapp-db-data:/var/lib/mysql

    networks:
      - todoapp-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  todoapp-db-data:
